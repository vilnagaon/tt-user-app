name: Teatower
options:
  bundleIdPrefix: com.teatower
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "2.0.0"

targets:
  Teatower:
    type: application
    platform: iOS
    sources:
      - path: Teatower
        excludes:
          - Package.swift
    info:
      path: Teatower/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teatower.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Teatower
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.food-and-drink"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Teatower utilise la caméra pour scanner les codes-barres de vos produits thé."
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Teatower/Teatower.entitlements
